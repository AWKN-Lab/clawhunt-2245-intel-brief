name: sample selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK font and PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one-command selftest
        run: bash setup.sh
